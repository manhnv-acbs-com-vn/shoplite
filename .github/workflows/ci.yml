# CI của ShopLite (Module 7).
# Bốn gate tất định QUYẾT ĐỊNH merge. Tên job = tên check bắt buộc trong ruleset của main:
#   lint · unit · e2e · bao-mat
# (Bài 7.1: chỉ 4 gate. Bài 7.4 thêm hai job AI giải thích CI đỏ - xem ci.yml.)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mặc định mọi job chỉ được đọc code. Job nào cần hơn thì tự khai báo, và chỉ phần cần.
permissions:
  contents: read

# Đẩy commit mới lên PR thì hủy lượt chạy cũ: không tốn phút chạy và tiền AI cho code đã cũ.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate lint (ESLint + luật BM-1, BM-2, KT-1 + TypeScript)
        run: node scripts/ci/gate.mjs lint
      - name: Giữ log khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lint
          path: gate-lint.*
          retention-days: 3

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate unit (Vitest + sàn coverage)
        run: node scripts/ci/gate.mjs unit
      - name: Giữ log khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-unit
          path: gate-unit.*
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Gate e2e (Playwright, chạy lại 1 lần, chập chờn vẫn tính là đỏ)
        run: node scripts/ci/gate.mjs e2e
      - name: Giữ log khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-e2e
          path: gate-e2e.*
          retention-days: 3
      - name: Giữ trace, ảnh chụp, video cho người đọc
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bang-chung
          path: test-results/
          retention-days: 3

  bao-mat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks quét CẢ lịch sử commit, không chỉ code hiện tại
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Cài gitleaks 8.30.1 (kiểm checksum trước khi chạy)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: npm ci
      - name: Gate bao-mat (gitleaks + npm audit + soát workflow + quét câu mồi)
        env:
          # Tiêu đề và mô tả PR đi qua biến môi trường, không chèn ${{ }} thẳng vào lệnh.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/gate.mjs bao-mat
      - name: Giữ log khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-bao-mat
          path: gate-bao-mat.*
          retention-days: 3
