name: CI

on:
  pull_request:
    branches: [main, bmad/module78]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint + typecheck + test
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
